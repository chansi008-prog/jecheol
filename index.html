<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="매달 제철 재료와 이번 주에 먹을 음식을 알려주는 앱">
<meta name="theme-color" content="#F2F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제철한입">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>제철한입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F2F3EC; --surface:#FFFFFF; --ink:#1D2420; --muted:#5F6A62; --line:#DCE0D5;
  --sea:#2F6F8F; --field:#5E8A3A; --fruit:#C2562B;
  --acc:#C2562B; --acc-soft:#F6E3D6;
  --display:"Hahmlet","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#141815; --surface:#1E2420; --ink:#E9ECE4; --muted:#9BA69C; --line:#2E3630;
    --sea:#7DB6D3; --field:#9CC57A; --fruit:#EE9A72; --acc-soft:#2C2620;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#141815; --surface:#1E2420; --ink:#E9ECE4; --muted:#9BA69C; --line:#2E3630;
  --sea:#7DB6D3; --field:#9CC57A; --fruit:#EE9A72; --acc-soft:#2C2620;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;padding-inline:18px;padding-block:20px 104px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:17px}
.brand b{color:var(--acc)}
.today{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.month-head{margin-top:22px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.month-num{font-family:var(--display);font-weight:800;font-size:76px;line-height:.85;color:var(--acc);font-variant-numeric:tabular-nums}
.month-num small{font-size:28px;margin-left:2px}
.month-mood{font-family:var(--display);font-weight:500;font-size:18px;line-height:1.35;padding-bottom:4px}
.back{grid-column:1/-1;justify-self:start;margin-top:8px;font-size:13px;color:var(--acc);font-weight:600}

.terms{margin-top:18px;display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.term{flex:1;padding:10px 0;display:flex;flex-direction:column;gap:1px}
.term + .term{border-left:1px solid var(--line);padding-left:14px}
.term .n{font-family:var(--display);font-weight:700;font-size:16px}
.term .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.term.passed .n{color:var(--muted)}
.term.next .n::after{content:attr(data-dday);font-family:var(--body);font-size:11px;font-weight:600;color:var(--acc);margin-left:6px;letter-spacing:.02em}

.pick{margin-top:22px;background:var(--surface);border-radius:20px;padding:22px 20px 18px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(30,40,30,.35);position:relative;overflow:hidden}
.pick::before{content:"";position:absolute;right:-48px;top:-48px;width:170px;height:170px;border-radius:50%;background:var(--acc-soft)}
.pick > *{position:relative}
.pick .eyebrow{color:var(--acc);font-weight:600}
.pick h2{font-size:30px;font-weight:800;margin-top:6px;line-height:1.2;padding-right:44px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.pick p{margin:14px 0 0;max-width:62ch}
.tip{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.tip strong{color:var(--ink);font-weight:600;margin-right:6px}
.heart{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);z-index:1}
.heart svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8}
.heart[aria-pressed="true"] svg{fill:var(--acc);stroke:var(--acc)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 10px;font-size:14px;font-weight:600}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--acc);color:#fff}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}

section{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.sec-h h3{font-size:19px;font-weight:700}
.sec-h span{font-size:12px;color:var(--muted)}

.weeks{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.wk:first-child{border-top:1px solid var(--line)}
.wk .w{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.wk .t{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.3}
.wk .s{display:block;font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
.custom{display:inline-block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--acc);border:1px solid currentColor;border-radius:99px;padding:0 8px;line-height:19px;vertical-align:2px;margin-left:6px}
.wk .now{font-size:11px;font-weight:600;color:#fff;background:var(--acc);border-radius:99px;padding:2px 9px}
.wk.sel{background:var(--acc-soft);border-radius:10px;border-color:transparent}
.wk.sel + .wk{border-top-color:transparent}

.cats{display:flex;flex-direction:column;gap:18px}
.cat-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:14px}
.chip[aria-expanded="true"]{border-color:var(--ink)}
.note{margin-top:10px;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.note b{color:var(--ink)}

/* regional */
.regions{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rg{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:13px 16px;align-items:start}
.rg + .rg{border-top:1px solid var(--line)}
.rg .where{font-size:12px;font-weight:600;color:var(--acc);line-height:1.4;padding-top:3px}
.rg .what{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.35}
.rg .why{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}

.cal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.mcell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.mcell .mn{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.mcell .mi{font-size:12px;color:var(--muted);line-height:1.45}
.mcell.cur{border-color:var(--ink);border-width:2px;padding:11px}
.mcell .bar{height:4px;border-radius:2px;width:28px}
@media (max-width:360px){.cal{grid-template-columns:repeat(2,1fr)}}

.empty{margin-top:28px;color:var(--muted);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:16px}
.fav{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.fav .t{font-family:var(--display);font-weight:700;font-size:17px}
.fav .s{font-size:12.5px;color:var(--muted)}
.fav button{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px}

/* sheet (recipe / reels) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--ground);overflow-y:auto;overscroll-behavior:contain}
.sheet-in{max-width:480px;margin:0 auto;padding-inline:18px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 40px)}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;padding-block:6px 14px;position:sticky;top:0;background:var(--ground);z-index:2}
.sheet-bar button{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600}
.sheet-bar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet-bar .ttl{font-size:13px;color:var(--muted)}

.rc-head h2{font-size:32px;font-weight:800;line-height:1.2}
.rc-head .eyebrow{color:var(--acc);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{padding:10px 0;display:flex;flex-direction:column}
.fact + .fact{border-left:1px solid var(--line);padding-left:12px}
.fact .k{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.fact .v{font-family:var(--display);font-weight:700;font-size:16px}
.ingl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.ingl li{padding:9px 0;border-bottom:1px dotted var(--line);font-size:14.5px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:15px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:15px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.rc-tip{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
.rc-tip b{color:var(--acc)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:8px 4px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.reel-wrap{margin:16px auto 0;width:min(100%,300px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;box-shadow:0 18px 40px -20px rgba(0,0,0,.45);background:var(--line)}
.reel-wrap img{display:block;width:100%;height:100%}
.reel-note{margin-top:12px;font-size:13px;color:var(--muted);text-align:center}
.swatches{display:flex;justify-content:center;gap:10px;margin-top:14px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.caption{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.caption .k{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.caption pre{margin:0;white-space:pre-wrap;font-family:var(--body);font-size:13.5px;line-height:1.6}
.caption button{font-size:12px;color:var(--acc);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:99px;font-size:13px;z-index:40}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab[aria-selected="true"] svg{stroke:var(--acc)}

@media (prefers-reduced-motion:no-preference){
  .pick{animation:rise .45s ease-out both}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
}
.install{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.install b{color:var(--acc)}
.install button{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<nav class="tabs" aria-label="메뉴">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" id="tab-today" data-tab="today" aria-selected="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>이번 주</button>
    <button class="tab" role="tab" id="tab-cal" data-tab="cal" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>열두 달</button>
    <button class="tab" role="tab" id="tab-fav" data-tab="fav" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>찜한 음식</button>
  </div>
</nav>

<script>
const CAT = {sea:["바다","--sea"], field:["밭·산","--field"], fruit:["과일","--fruit"]};
/* 월별 데이터
   wk: [메뉴, 재료, 추천 이유, 한 줄 팁, [조리시간, 난이도, 재료(2인분), 순서[]]]
   reg: [지역, 특산물, 설명] */
const M = [
 {mood:"한겨울 바다가 가장 살찐 달", c:["#2F6F8F","#7DB6D3"], terms:[["소한",1,5],["대한",1,20]],
  ing:[["굴","sea","‘바다의 우유’. 찬물에서 알이 가장 통통해요"],["꼬막","sea","벌교 참꼬막이 쫄깃하게 차오르는 때"],["대구","sea","산란 전 살이 단단하고 이리가 고소해요"],["과메기","sea","해풍에 말린 청어·꽁치, 겨울 한정"],["시금치","field","눈 맞은 노지 섬초는 단맛이 진해요"],["우엉","field","뿌리채소의 향이 가장 짙은 계절"],["한라봉","fruit","새콤달콤, 껍질째 향이 좋아요"],["귤","fruit","노지 귤 출하 막바지"]],
  reg:[["전남 보성 벌교","참꼬막","갯벌 꼬막의 대명사, 1월이 가장 쫄깃해요"],["경북 포항 구룡포","과메기","겨울 해풍에 얼었다 녹기를 반복하며 말려요"],["경남 거제 외포","대구","한겨울 대구 위판장이 가장 붐비는 곳"],["전남 신안 비금도","섬초","해풍 맞고 자란 납작 시금치, 단맛이 진해요"]],
  wk:[["굴국밥","굴","새해 첫 주, 속을 데우는 한 그릇. 굴은 1월에 가장 크고 달아요.","굴은 마지막에 넣고 한소끔만 — 오래 끓이면 질겨져요.",["25분","쉬움","굴 200g, 밥 2공기, 무 100g, 부추 한 줌, 달걀 1개, 다진 마늘 1큰술, 국간장 1큰술, 멸치육수 800ml, 소금 약간",["굴은 옅은 소금물에 흔들어 씻고 물기를 빼요.","육수에 채 썬 무를 넣고 무가 투명해질 때까지 끓여요.","다진 마늘과 국간장으로 간하고 굴을 넣어 한소끔만 끓여요.","부추와 달걀물을 풀고 바로 불을 꺼요.","그릇에 밥을 담고 국을 부어 내요."]]],
      ["꼬막비빔밥","꼬막","제철 참꼬막은 삶아만 둬도 짭조름한 단맛이 납니다.","한 방향으로 저으며 삶다가 입이 한두 개 벌어지면 바로 건지세요.",["30분 (+해감 1시간)","보통","꼬막 500g, 밥 2공기, 부추 반 줌, 간장 3큰술, 고춧가루 1큰술, 다진 마늘 1/2큰술, 참기름 1큰술, 깨 약간",["꼬막을 박박 문질러 씻고 어두운 곳에서 소금물에 1시간 해감해요.","끓는 물에 넣고 한 방향으로 저으며 3~4분 삶아요.","입이 벌어지기 시작하면 건져 살만 발라요.","간장·고춧가루·마늘·참기름으로 양념장을 만들어 꼬막을 버무려요.","송송 썬 부추와 함께 밥 위에 올리고 깨를 뿌려요."]]],

  (document.documentElement.dataset.theme!=="light" && matchMedia("(prefers-color-scheme: dark)").matches);

function applyAccent(m){
  const r=document.documentElement.style, c=M[m].c[isDark()?1:0];
  r.setProperty("--acc", c);
  r.setProperty("--acc-soft", `color-mix(in srgb, ${c} ${isDark()?18:14}%, var(--surface))`);
}

function nextTerm(){
  const y=NOW.getFullYear(), today=new Date(y,NOW.getMonth(),NOW.getDate());
  for(let i=0;i<24;i++){
    const off=curM+Math.floor(i/2), mm=off%12, t=M[mm].terms[i%2];
    const d=new Date(y+(off>11?1:0), t[1]-1, t[2]);
    if(d>=today) return {n:t[0], dd:Math.round((d-today)/864e5)};
  }
}
function termsHtml(m){
  const next=nextTerm();
  return '<div class="terms">'+M[m].terms.map(t=>{
    let cls="", dday="";
    if(m===curM && t[2]<NOW.getDate()) cls="passed";
    if(next.n===t[0]){ cls="next"; dday= next.dd===0?"오늘":"D-"+next.dd; }
    return `<div class="term ${cls}"><span class="n" ${dday?`data-dday="${dday}"`:""}>${t[0]}</span><span class="d">${t[1]}월 ${t[2]}일경</span></div>`;
  }).join("")+ (m===curM && !M[m].terms.some(t=>t[0]===next.n)
     ? `<div class="term next"><span class="n" data-dday="D-${next.dd}">${next.n}</span><span class="d">다음 절기</span></div>`:"")
  +'</div>';
}

/* ---------- 릴스 카드 ---------- */
const TPL = [["week","이번 주 한 메뉴"],["month","4주 메뉴"],["ing","제철 재료"]];
function tones(m){ const c=M[m].c[0]; return [
  {bg:mix(c,"#FFFFFF",.86), ink:"#1D2420", acc:c, sub:"#5F6A62", card:"#FFFFFF"},
  {bg:c, ink:"#FFFFFF", acc:"#FFFFFF", sub:"rgba(255,255,255,.78)", card:"rgba(255,255,255,.14)"},
  {bg:"#171B18", ink:"#F1F2EC", acc:M[m].c[1], sub:"#A3ADA4", card:"#232924"}]; }
function mix(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const A=p(a),B=p(b);
  return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); }

function viewReel(){
  return `<div class="sheet-in">
    <div class="sheet-bar"><button data-close>${ICON.back}돌아가기</button><span class="ttl">릴스 카드 · 1080×1920</span></div>
    <div class="seg" role="group" aria-label="카드 종류">${TPL.map(t=>`<button data-tpl="${t[0]}" aria-pressed="${state.reel.tpl===t[0]}">${t[1]}</button>`).join("")}</div>
    <div class="reel-wrap"><img id="reelImg" alt="릴스 카드 미리보기"></div>
    <div class="swatches" role="group" aria-label="색 조합">${tones(state.m).map((t,i)=>`<button class="sw" data-tone="${i}" aria-pressed="${state.reel.tone===i}" aria-label="색 조합 ${i+1}" style="background:${t.bg}"></button>`).join("")}</div>
    <div class="actions"><button class="btn primary" id="saveReel" style="grid-column:1/-1">${ICON.dl}저장 · 공유하기</button></div>
    <p class="reel-note" id="reelNote">휴대폰에서는 공유 창이 열려요 — ‘이미지 저장’이나 인스타그램을 고르세요.</p>
    <div class="caption"><div class="k"><span>캡션 · 해시태그</span><button data-copy>복사</button></div><pre id="cap">${captionText()}</pre></div>
  </div>`;
}
function captionText(){
  const d=M[state.m], w=d.wk[state.w], tag=s=>"#"+s.replace(/[\s·]/g,"");
  if(state.reel.tpl==="month") return `${state.m+1}월엔 이렇게 드셔보세요 🍽\n${d.wk.map((x,i)=>`${i+1}주차 ${x[0]}`).join("\n")}\n\n${["제철음식",state.m+1+"월제철음식",...d.wk.map(x=>x[1]),"제철한입"].map(tag).join(" ")}`;
  if(state.reel.tpl==="ing") return `${state.m+1}월 제철 재료, 지금이 제일 맛있어요\n${d.ing.map(i=>i[0]).join(" · ")}\n\n${["제철음식",state.m+1+"월제철",...d.ing.slice(0,5).map(i=>i[0]),"제철한입"].map(tag).join(" ")}`;
  return `이번 주엔 ${w[0]} 어떠세요?\n${w[2]}\n\n💡 ${w[3]}\n\n${["제철음식",state.m+1+"월제철음식",w[0],w[1],"제철레시피","제철한입"].map(tag).join(" ")}`;
}

function wrap(ctx,text,maxW){
  const words=text.split(" "), lines=[]; let line="";
  for(const wd of words){
    const test=line?line+" "+wd:wd;
    if(ctx.measureText(test).width<=maxW){ line=test; continue; }
    if(line) lines.push(line);
    if(ctx.measureText(wd).width>maxW){ let part=""; for(const ch of wd){ if(ctx.measureText(part+ch).width>maxW){lines.push(part);part=ch;} else part+=ch; } line=part; }
    else line=wd;
  }
  if(line) lines.push(line); return lines;
}
const F = (w,s,fam)=>`${w} ${s}px ${fam==="d"?'"Hahmlet", serif':'"IBM Plex Sans KR", sans-serif'}`;

async function drawReel(){
  const d=M[state.m], w=d.wk[state.w];
  // 한글 웹폰트는 글자 범위별로 나눠 받으므로, 카드에 들어갈 글자를 모두 미리 받아 둔다
  const txt="제철한입월주차추천이번엔걸드셔보세요맛있게먹는법재료바다밭산과일지금가장한에메뉴0123456789·|. "+JSON.stringify(d);
  await Promise.all([[800,"d"],[700,"d"],[500,"d"],[500,"b"],[600,"b"],[700,"b"],[800,"b"]].map(([wt,f])=>document.fonts.load(F(wt,40,f),txt))).catch(()=>{});
  const W=1080,H=1920, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d"), t=tones(state.m)[state.reel.tone], P=96;
  x.fillStyle=t.bg; x.fillRect(0,0,W,H);
  // 큰 원 장식
  x.globalAlpha=state.reel.tone===1?.12:.10; x.fillStyle=state.reel.tone===1?"#FFFFFF":t.acc;
  x.beginPath(); x.arc(W-60,300,380,0,Math.PI*2); x.fill(); x.globalAlpha=1;
  // 상단: 브랜드 + 절기
  x.textBaseline="alphabetic"; x.fillStyle=t.ink; x.font=F(800,40,"d"); x.fillText("제철한입",P,170);
  x.fillStyle=t.sub; x.font=F(500,32,"b"); x.textAlign="right";
  x.fillText(d.terms.map(z=>`${z[0]} ${z[1]}.${z[2]}`).join("  ·  "),W-P,168); x.textAlign="left";
  // 월 숫자
  x.fillStyle=t.acc; x.font=F(800,300,"d"); x.fillText(String(state.m+1),P-10,520);
  const mw=x.measureText(String(state.m+1)).width; x.font=F(800,96,"d"); x.fillText("월",P+mw,520);
  x.fillStyle=t.ink; x.font=F(500,44,"d"); wrap(x,d.mood,W-2*P).forEach((l,i)=>x.fillText(l,P,610+i*60));
  let y=780;
  if(state.reel.tpl==="week"){
    x.fillStyle=t.acc; x.font=F(600,38,"b"); x.fillText(state.m===curM&&state.w===curW?"이번 주엔 이걸 드셔보세요":`${state.w+1}주차 추천`,P,y);
    y+=40; x.fillStyle=t.ink; x.font=F(800,132,"d");
    wrap(x,w[0],W-2*P).forEach(l=>{y+=150; x.fillText(l,P,y);});
    y+=96; x.fillStyle=t.sub; x.font=F(500,36,"b"); x.fillText(`${CUSTOM[key(state.m,state.w)]?CUSTOM[key(state.m,state.w)]+"   |   ":""}제철 재료 · ${w[1]}   |   ${w[4][0]}`,P,y);
    y+=90; x.fillStyle=t.ink; x.font=F(500,46,"b"); wrap(x,w[2],W-2*P).forEach(l=>{x.fillText(l,P,y); y+=70;});
    // 팁 박스
    x.font=F(500,38,"b"); const tl=wrap(x,w[3],W-2*P-96); const bh=110+tl.length*58; y+=40;
    x.fillStyle=t.card; rr(x,P,y,W-2*P,bh,36); x.fill();
    x.fillStyle=t.acc; x.font=F(600,32,"b"); x.fillText("맛있게 먹는 법",P+48,y+70);
    x.fillStyle=t.ink; x.font=F(500,38,"b"); tl.forEach((l,i)=>x.fillText(l,P+48,y+130+i*58));
  } else if(state.reel.tpl==="month"){
    x.fillStyle=t.acc; x.font=F(600,38,"b"); x.fillText(`${state.m+1}월엔 한 주에 한 메뉴`,P,y); y+=50;
    d.wk.forEach((it,i)=>{
      const h=200; x.fillStyle=t.card; rr(x,P,y,W-2*P,h,36); x.fill();
      x.fillStyle=t.acc; x.font=F(800,34,"b"); x.fillText(`${i+1}주차`,P+48,y+68);
      x.fillStyle=t.ink; x.font=F(800,72,"d"); x.fillText(it[0],P+48,y+150);
      x.fillStyle=t.sub; x.font=F(500,32,"b"); x.textAlign="right"; x.fillText(it[1],W-P-48,y+68); x.textAlign="left";
      y+=h+22;
    });
  } else {
    x.fillStyle=t.acc; x.font=F(600,38,"b"); x.fillText(`${state.m+1}월, 지금 가장 맛있는 재료`,P,y); y+=40;
    Object.keys(CAT).forEach(c=>{
      const items=d.ing.filter(i=>i[1]===c); if(!items.length) return;
      y+=80; x.fillStyle=t.sub; x.font=F(600,34,"b"); x.fillText(CAT[c][0],P,y); y+=30;
      let cx=P; x.font=F(700,52,"d");
      items.forEach(it=>{
        const tw=x.measureText(it[0]).width+72;
        if(cx+tw>W-P){cx=P; y+=104;}
        x.fillStyle=t.card; rr(x,cx,y,tw,88,44); x.fill();
        x.fillStyle=t.ink; x.fillText(it[0],cx+36,y+62); cx+=tw+18;
      }); y+=88;
    });
  }
  // 하단
  x.fillStyle=t.sub; x.font=F(500,30,"b"); x.fillText("매주 제철 한 입 — 저장해 두고 장 볼 때 꺼내 보세요",P,H-96);
  return cv;
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

let reelCanvas=null;
async function refreshReel(){
  reelCanvas = await drawReel();
  const img=document.getElementById("reelImg"); if(img) img.src=reelCanvas.toDataURL("image/png");
  const cap=document.getElementById("cap"); if(cap) cap.textContent=captionText();
}


function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }

let deferredPrompt=null, hideInstall=false;
try{ hideInstall = localStorage.getItem("jc-hide-install")==="1"; }catch(e){}
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; render(); });
function installHint(){
  if(standalone || hideInstall) return "";
  if(deferredPrompt) return `<div class="install"><span><b>앱으로 설치</b>하면 홈 화면에서 바로 열 수 있어요.</span><span><button class="btn primary" data-install style="padding:7px 12px">설치</button> <button data-hideinstall>닫기</button></span></div>`;
  if(isIOS) return `<div class="install"><span>Safari 아래 <b>공유 버튼</b> → <b>‘홈 화면에 추가’</b>를 누르면 앱처럼 쓸 수 있어요.</span><button data-hideinstall>닫기</button></div>`;
  return "";
}

function render(){
  applyAccent(state.tab==="today"||state.sheet?state.m:curM);
  document.getElementById("app").innerHTML = state.tab==="today"?viewToday():state.tab==="cal"?viewCal():viewFav();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab===state.tab));
  const sh=document.getElementById("sheet");
  if(state.sheet){ sh.innerHTML = state.sheet==="recipe"?viewRecipe():viewReel(); sh.hidden=false; document.body.classList.add("locked"); if(state.sheet==="reel") refreshReel(); }
  else { sh.hidden=true; sh.innerHTML=""; document.body.classList.remove("locked"); }
}

document.addEventListener("click", async e=>{
  const t=e.target.closest("button"); if(!t) return;
  const ds=t.dataset;
  if(ds.tab){ state.tab=ds.tab; window.scrollTo(0,0); }
  else if(ds.w){ state.w=+ds.w; document.querySelector(".pick")?.scrollIntoView({behavior:"smooth",block:"center"}); }
  else if(ds.ing){ state.open = state.open===ds.ing?null:ds.ing; }
  else if(ds.m){ state.m=+ds.m; state.w= state.m===curM?curW:0; state.open=null; state.tab="today"; window.scrollTo(0,0); }
  else if(ds.go){ state.m=curM; state.w=curW; state.open=null; }
  else if(ds.fav){ const k=ds.fav; favs = favs.includes(k)?favs.filter(x=>x!==k):[...favs,k]; saveFavs(); }
  else if(ds.unfav){ favs=favs.filter(x=>x!==ds.unfav); saveFavs(); }
  else if(ds.recipe){ [state.m,state.w]=ds.recipe.split("-").map(Number); state.sheet="recipe"; }
  else if(ds.open){ state.sheet=ds.open; document.getElementById("sheet").scrollTop=0; }
  else if("close" in ds){ state.sheet=null; }
  else if("install" in ds){ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; } }
  else if("hideinstall" in ds){ hideInstall=true; try{ localStorage.setItem("jc-hide-install","1"); }catch(e){} }
  else if(ds.tpl){ state.reel.tpl=ds.tpl; document.querySelectorAll("[data-tpl]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tpl===ds.tpl)); refreshReel(); return; }
  else if(ds.tone){ state.reel.tone=+ds.tone; document.querySelectorAll("[data-tone]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tone===ds.tone)); refreshReel(); return; }
  else if("copy" in ds){
    const txt=captionText();
    try{ await navigator.clipboard.writeText(txt); toast("캡션을 복사했어요"); }
    catch(err){ const r=document.createRange(); r.selectNodeContents(document.getElementById("cap")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("선택됐어요 — 복사해 주세요"); }
    return;
  }
  else if(t.id==="saveReel"){
    if(!reelCanvas) await refreshReel();
    const name=`제철한입_${state.m+1}월_${state.reel.tpl==="week"?M[state.m].wk[state.w][0]:state.reel.tpl==="month"?"4주메뉴":"제철재료"}.png`.replace(/\s/g,"");
    const blob=await new Promise(r=>reelCanvas.toBlob(r,"image/png"));
    const file=new File([blob],name,{type:"image/png"});
    // 휴대폰: 공유 시트(사진에 저장·인스타그램·카톡)로, PC: 파일 다운로드
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], text:captionText()}); }
      catch(err){ if(err.name!=="AbortError") document.getElementById("reelNote").textContent="공유하지 못했어요. 미리보기 이미지를 길게 눌러 저장하세요."; }
    } else {
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("이미지를 저장했어요");
    }
    return;
  }
  else return;
  render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
render();
if("serviceWorker" in navigator) addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
